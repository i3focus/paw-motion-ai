        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/HealthRecordDto"
    delete:
      tags:
      - Health passport
      operationId: deleteRecord
      parameters:
