openapi: 3.1.0
info:
  title: PawMotion AI API
  version: 0.1.0
  description: Initial contract for the modular monolith MVP. Errors use RFC 9457 Problem Details.
servers:
  - url: http://localhost:8080
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Pets
  - name: Activities
  - name: Dashboard
  - name: AI Insights
  - name: Profiles
  - name: Partner Portal
  - name: Recommendations
paths:
  /api/auth/register:
    post:
      tags: [Identity]
      summary: Register an owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
      responses:
        '201':
          description: Owner registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    post:
      tags: [Identity]
      summary: Authenticate an owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/partner/auth/register:
    post:
      tags: [Partner Portal]
      summary: Register a partner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPartnerRequest'
      responses:
        '201':
          description: Partner registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/partner/auth/login:
    post:
      tags: [Partner Portal]
      summary: Authenticate a partner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /api/me:
    get:
      tags: [Profiles]
      summary: Get the authenticated owner or partner profile
      responses:
        '200':
          description: Account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
    patch:
      tags: [Profiles]
      summary: Update the authenticated owner or partner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated account profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/partner/campaigns:
    get:
      tags: [Partner Portal]
      summary: List campaigns for the authenticated partner
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignResponse'
    post:
      tags: [Partner Portal]
      summary: Create an advertisement or campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/partner/campaigns/{campaignId}/analyze:
    post:
      tags: [Partner Portal]
      summary: Analyze a campaign and generate owner-facing topics
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analyzed campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/partner/campaigns/{campaignId}/archive:
    post:
      tags: [Partner Portal]
      summary: Archive a campaign and refund prorated credits
      parameters:
        - name: campaignId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Archived campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/partner/wallet:
    get:
      tags: [Partner Portal]
      summary: Get the authenticated partner wallet and account balances
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404': { $ref: '#/components/responses/Problem' }
  /api/partner/wallet/accounts/{accountId}/entries:
    get:
      tags: [Partner Portal]
      summary: List ledger entries for a wallet account
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
      responses:
        '200':
          description: Ledger entry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryPage'
        '404': { $ref: '#/components/responses/Problem' }
  /api/partner/billing/pricing:
    get:
      tags: [Partner Billing]
      summary: Get credit pricing and campaign pricing configuration
      responses:
        '200':
          description: Pricing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingResponse'
  /api/partner/billing/purchases:
    get:
      tags: [Partner Billing]
      summary: List credit purchases for the authenticated partner
      responses:
        '200':
          description: Purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentTransactionResponse'
    post:
      tags: [Partner Billing]
      summary: Create a hosted-checkout credit purchase
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequest'
      responses:
        '201':
          description: Purchase created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '402': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/partner/billing/purchases/{transactionId}:
    get:
      tags: [Partner Billing]
      summary: Get one credit purchase
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionResponse'
        '404': { $ref: '#/components/responses/Problem' }
  /api/webhooks/payments/{provider}:
    post:
      tags: [Partner Billing]
      summary: Receive a payment provider webhook
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Webhook accepted }
        '401': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /api/admin/partners/{partnerId}/wallet/unblock:
    post:
      tags: [Admin]
      summary: Unblock a partner wallet (ADMIN)
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/partners/{partnerId}/wallet/adjustments:
    post:
      tags: [Admin]
      summary: Post a manual wallet adjustment (ADMIN)
      parameters:
        - name: partnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAdjustmentRequest'
      responses:
        '201': { description: Adjustment posted }
        '402': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/recommendations:
    get:
      tags: [Recommendations]
      summary: List AI-analyzed partner recommendations for pet owners
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerRecommendationResponse'
  /api/promotions:
    get:
      tags: [Promotions]
      summary: List active partner promotions for pet owners
      responses:
        '200':
          description: Active promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerPromotionResponse'
  /api/pets:
    get:
      tags: [Pets]
      summary: List pets owned by the authenticated owner
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetResponse'
    post:
      tags: [Pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '422':
          $ref: '#/components/responses/Problem'
  /api/pets/{petId}:
    get:
      tags: [Pets]
      summary: Get an owned pet
      parameters:
        - $ref: '#/components/parameters/PetId'
      responses:
        '200':
          description: Pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Pets]
      summary: Update an owned pet profile
      parameters:
        - $ref: '#/components/parameters/PetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/activities:
    get:
      tags: [Activities]
      summary: List activities for the authenticated owner
      parameters:
        - name: petId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityResponse'
    post:
      tags: [Activities]
      summary: Record an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Recorded activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get owner dashboard statistics
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
  /api/insights:
    post:
      tags: [AI Insights]
      summary: Generate an activity insight
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateInsightRequest'
      responses:
        '200':
          description: Insight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightResponse'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
    RegisterOwnerRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, owner]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer }
        owner:
          $ref: '#/components/schemas/OwnerResponse'
    OwnerResponse:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [OWNER, PARTNER] }
        bio: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        businessName: { type: string, nullable: true }
        website: { type: string, nullable: true }
        partnerDescription: { type: string, nullable: true }
    RegisterPartnerRequest:
      type: object
      required: [email, password, displayName, businessName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        businessName: { type: string, minLength: 1, maxLength: 160 }
        website: { type: string, maxLength: 300 }
        partnerDescription: { type: string, maxLength: 1000 }
    UpdateProfileRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, maxLength: 500 }
        phone: { type: string, maxLength: 40 }
        avatarUrl: { type: string, maxLength: 500 }
        businessName: { type: string, maxLength: 160 }
        website: { type: string, maxLength: 300 }
        partnerDescription: { type: string, maxLength: 1000 }
    CreateCampaignRequest:
      type: object
      required: [title, description, targetAudience, callToAction]
      properties:
        title: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        targetAudience: { type: string, minLength: 2, maxLength: 160 }
        callToAction: { type: string, minLength: 2, maxLength: 160 }
    CampaignResponse:
      type: object
      required: [id, partnerId, title, description, targetAudience, callToAction, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        targetAudience: { type: string }
        callToAction: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED, EXPIRED] }
        aiTopics:
          type: array
          items: { type: string }
        analyzedAt: { type: string, format: date-time, nullable: true }
        creditsCharged: { type: integer, format: int64 }
        creditsRefunded: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        remainingBalance: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WalletAccountResponse:
      type: object
      required: [id, walletId, code, status, balance]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        code: { type: string, enum: [MAIN, BONUS, PARTNER] }
        status: { type: string, enum: [OPEN, CLOSED] }
        balance: { type: integer, format: int64 }
    WalletResponse:
      type: object
      required: [walletId, partnerId, status, accounts, totalBalance]
      properties:
        walletId: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, BLOCKED] }
        blockedReason: { type: string, nullable: true }
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/WalletAccountResponse'
        totalBalance: { type: integer, format: int64 }
    LedgerEntryResponse:
      type: object
      required: [id, accountId, accountCode, direction, amount, balanceAfter, referenceType, referenceId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountCode: { type: string, enum: [MAIN, BONUS, PARTNER], nullable: true }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        referenceType: { type: string }
        referenceId: { type: string, format: uuid }
        description: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    LedgerEntryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntryResponse'
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PricingResponse:
      type: object
      required: [currency, creditsPerCurrencyUnit, minPurchaseAmount, maxPurchaseAmount, campaignPriceAmount, campaignCreationCostCredits, campaignDurationDays, paymentProvider]
      properties:
        currency: { type: string, example: BRL }
        creditsPerCurrencyUnit: { type: number }
        minPurchaseAmount: { type: number }
        maxPurchaseAmount: { type: number }
        campaignPriceAmount: { type: number }
        campaignCreationCostCredits: { type: integer, format: int64 }
        campaignDurationDays: { type: integer }
        paymentProvider: { type: string }
    CreatePurchaseRequest:
      type: object
      required: [amount]
      properties:
        amount: { type: number, minimum: 0.01 }
        method: { type: string, enum: [PIX, CARD], nullable: true }
        customerId: { type: string, nullable: true }
    PaymentTransactionResponse:
      type: object
      required: [id, partnerId, amount, currency, expectedCredits, provider, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        expectedCredits: { type: integer, format: int64 }
        method: { type: string, nullable: true }
        provider: { type: string }
        status: { type: string, enum: [PENDING, CONFIRMED, FAILED, EXPIRED, CANCELED, DISPUTED, REFUNDED] }
        providerCheckoutUrl: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminAdjustmentRequest:
      type: object
      required: [accountCode, direction, amount, reason]
      properties:
        accountCode: { type: string, enum: [MAIN, BONUS, PARTNER] }
        direction: { type: string, enum: [CREDIT, DEBIT] }
        amount: { type: integer, format: int64, minimum: 1 }
        reason: { type: string }
    OwnerRecommendationResponse:
      type: object
      required: [campaignId, campaignTitle, partnerName, description, callToAction, recommendedTopics, analyzedAt]
      properties:
        campaignId: { type: string, format: uuid }
        campaignTitle: { type: string }
        partnerName: { type: string }
        description: { type: string }
        callToAction: { type: string }
        recommendedTopics:
          type: array
          items: { type: string }
        analyzedAt: { type: string, format: date-time, nullable: true }
    OwnerPromotionResponse:
      type: object
      required: [campaignId, partnerName, title, description, targetAudience, callToAction, createdAt]
      properties:
        campaignId: { type: string, format: uuid }
        partnerName: { type: string }
        partnerWebsite: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        targetAudience: { type: string }
        callToAction: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreatePetRequest:
      type: object
      required: [name, species, size]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        species: { type: string, enum: [dog, cat, bird, rabbit, other] }
        breed: { type: string, maxLength: 80 }
        birthDate: { type: string, format: date }
        size: { type: string, enum: [small, medium, large] }
        activityPreference: { type: string, maxLength: 120 }
    PetResponse:
      allOf:
        - $ref: '#/components/schemas/CreatePetRequest'
        - type: object
          required: [id, ownerId, status, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive] }
            createdAt: { type: string, format: date-time }
    CreateActivityRequest:
      type: object
      required: [petId, type, startedAt, durationSeconds]
      properties:
        petId: { type: string, format: uuid }
        type: { type: string, enum: [walk, run, hike, bike_ride, swim, play] }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 1 }
        distanceMeters: { type: number, minimum: 0 }
        notes: { type: string, maxLength: 500 }
    ActivityResponse:
      allOf:
        - $ref: '#/components/schemas/CreateActivityRequest'
        - type: object
          required: [id, ownerId, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    DashboardSummaryResponse:
      type: object
      required: [ownerId, petCount, activityCountLast7Days, totalDistanceMetersLast7Days, totalDurationSecondsLast7Days, currentStreakDays]
      properties:
        ownerId: { type: string, format: uuid }
        petCount: { type: integer }
        activityCountLast7Days: { type: integer }
        totalDistanceMetersLast7Days: { type: number }
        totalDurationSecondsLast7Days: { type: integer }
        currentStreakDays: { type: integer }
        recentActivities:
          type: array
          items:
