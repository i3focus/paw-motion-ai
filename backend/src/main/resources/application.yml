spring:
  application:
    name: paw-motion-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawmotion}
    username: ${DB_USERNAME:pawmotion}
    password: ${DB_PASSWORD:pawmotion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:paw-motion-ai}
      secret: ${JWT_SECRET}
      ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
